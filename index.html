<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庄沅霖的个人站</title>
<meta name="description" content="庄沅霖的个人站 · 关于 / 作品 / 摄影 / 碎碎念 / 经验 / 链接">
<link rel="icon" href="assets/icon_star.webp">
<link rel="stylesheet" href="css/style.css?v=33">
</head>
<body>

  <!-- 左上角：主题 / 音效切换 -->
  <div class="sys-controls">
    <button id="btn-theme" class="sys-btn" aria-label="切换主题">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="btn-sound" class="sys-btn" aria-label="切换音效">
      <svg class="ico-snd-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <svg class="ico-snd-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m16 9 5 5M21 9l-5 5"/></svg>
    </button>
  </div>

  <!-- 顶部星星吉祥物（彩蛋：hover/点击弹气泡） -->
  <div class="mascot-star" id="star" aria-hidden="true">
    <div class="bubble" id="star-bubble">有趣的事情</div>
    <img src="assets/icon_star.webp" alt="" draggable="false">
  </div>

  <!-- 中央单窗口 -->
  <main class="win" id="win">
    <div class="win__bar"><span id="win-title">首页</span><button id="win-close" class="win__close hide" aria-label="关闭并返回首页">[x]</button></div>
    <div class="win__body" id="win-body"><!-- JS 渲染 --></div>
  </main>

  <!-- 底部社交 + 版权 -->
  <footer class="footer">
    <div class="socials" id="socials"><!-- JS 渲染 --></div>
    <p class="copyright" id="copyright"></p>
  </footer>

  <!-- 右下角绿色小团子（BGM 播放时唱歌冒音符） -->
  <div class="mascot-blob" id="blob" aria-hidden="true">
    <div class="notes" id="blob-notes"></div>
    <svg viewBox="0 0 140 110">
      <ellipse cx="70" cy="96" rx="58" ry="9" fill="#9ED44C" opacity=".5"/>
      <path d="M25 88c-8-26 6-56 45-56s54 30 45 56c-3 8-12 10-45 10s-42-2-45-10z" fill="#7CB93E" stroke="#5E9427" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="53" cy="66" r="5" fill="#2E4A12"/>
      <circle cx="87" cy="66" r="5" fill="#2E4A12"/>
      <path d="M60 78q10 8 20 0" fill="none" stroke="#2E4A12" stroke-width="3" stroke-linecap="round"/>
      <circle cx="42" cy="78" r="6" fill="#FF9D9D" opacity=".65"/>
      <circle cx="98" cy="78" r="6" fill="#FF9D9D" opacity=".65"/>
      <g transform="translate(70 18)">
        <circle r="7" fill="#FFF3F5" stroke="#F3A8B8" stroke-width="2"/>
        <circle cx="0" cy="-11" r="4.5" fill="#FFF3F5" stroke="#F3A8B8" stroke-width="2"/>
        <circle cx="10" cy="-7" r="4.5" fill="#FFF3F5" stroke="#F3A8B8" stroke-width="2"/>
        <circle cx="-10" cy="-7" r="4.5" fill="#FFF3F5" stroke="#F3A8B8" stroke-width="2"/>
        <circle cx="7" cy="4" r="4.5" fill="#FFF3F5" stroke="#F3A8B8" stroke-width="2"/>
        <circle cx="-7" cy="4" r="4.5" fill="#FFF3F5" stroke="#F3A8B8" stroke-width="2"/>
      </g>
    </svg>
  </div>

  <!-- 天空里的纸飞机：沿弧线缓缓飞过（水平匀速 + 上下摆动叠加成弧线） -->
  <!-- 夜间模式专属：月亮 + 闪烁星空（仅深色主题显示，星星由 JS 随机生成） -->
  <div class="night-sky" aria-hidden="true">
    <div class="moon">
      <span class="moon__halo"></span>
      <svg viewBox="0 0 100 100">
        <circle class="moon__disc" cx="50" cy="50" r="27"/>
        <circle class="moon__cut" cx="66" cy="38" r="26"/>
      </svg>
    </div>
    <!-- 小王子：坐在带环小星球上望着月亮 -->
    <div class="little-prince">
      <svg viewBox="0 0 130 155" fill="none">
        <!-- 小星球 + 光环 -->
        <circle cx="60" cy="124" r="28" fill="#6c7ee0"/>
        <circle cx="50" cy="118" r="4" fill="#8b9aee"/>
        <circle cx="72" cy="133" r="3" fill="#5a68c4"/>
        <ellipse cx="60" cy="124" rx="52" ry="11" transform="rotate(-16 60 124)" stroke="#cdb9ff" stroke-width="3.5" opacity=".9"/>
        <!-- 小王子（坐姿，面朝月亮方向） -->
        <path d="M64 98 L77 104 L77 117" stroke="#3a4664" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 100 L70 110 L70 121" stroke="#46547a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="78" cy="119" r="4.5" fill="#22304a"/>
        <circle cx="70" cy="123" r="4.5" fill="#22304a"/>
        <path d="M58 74 Q56 96 66 98 Q77 99 75 76 Z" fill="#7cc576" stroke="#4e9450" stroke-width="2" stroke-linejoin="round"/>
        <path d="M62 80 Q70 89 77 86" stroke="#5da55c" stroke-width="4" stroke-linecap="round"/>
        <path d="M58 74 Q67 79 75 74" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
        <path d="M58 74 L46 79" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
        <circle cx="67" cy="52" r="15" fill="#ffe3c2" stroke="#e8c39a" stroke-width="2"/>
        <path d="M52 50 Q52 35 67 34 Q82 33 83 48 L78 43 L74 48 L70 41 L66 47 L61 41 L57 48 Z" fill="#f7c948"/>
        <circle cx="71" cy="53" r="2" fill="#3a3226"/>
        <circle cx="78" cy="51" r="2" fill="#3a3226"/>
        <path d="M72 60 Q75 62 78 60" stroke="#3a3226" stroke-width="1.8" stroke-linecap="round"/>
        <!-- 身边一颗眨眼的小星星 -->
        <circle class="prince-star" cx="106" cy="28" r="3" fill="#ffe9b0"/>
      </svg>
    </div>
    <div class="stars" id="stars"></div>
  </div>

  <div class="sky-planes" aria-hidden="true">
    <div class="plane plane--a">
      <div class="plane__3d">
        <svg class="pw pw--l" viewBox="0 0 52 19"><path d="M52 19 L0 0 L16 19 Z"/></svg>
        <svg class="pw pw--r" viewBox="0 0 52 19"><path d="M52 0 L0 19 L16 0 Z"/></svg>
        <svg class="pw pw--keel" viewBox="0 0 52 18"><path d="M52 0 L9 0 L9 18 Z"/></svg>
      </div>
    </div>
    <div class="plane plane--b">
      <div class="plane__3d">
        <svg class="pw pw--l" viewBox="0 0 52 19"><path d="M52 19 L0 0 L16 19 Z"/></svg>
        <svg class="pw pw--r" viewBox="0 0 52 19"><path d="M52 0 L0 19 L16 0 Z"/></svg>
        <svg class="pw pw--keel" viewBox="0 0 52 18"><path d="M52 0 L9 0 L9 18 Z"/></svg>
      </div>
    </div>
  </div>

  <!-- 底部浅蓝山坡（动态：两层波浪缓缓流动，周期性波形无缝循环） -->
  <div class="hill" aria-hidden="true">
    <div class="hill-wave hill-wave--back">
      <svg viewBox="0 0 1440 190" preserveAspectRatio="none"><path class="hill1" d="M0 70 Q 180 28 360 70 T 720 70 T 1080 70 T 1440 70 V190 H0 Z"/></svg>
      <svg viewBox="0 0 1440 190" preserveAspectRatio="none"><path class="hill1" d="M0 70 Q 180 28 360 70 T 720 70 T 1080 70 T 1440 70 V190 H0 Z"/></svg>
    </div>
    <div class="hill-wave hill-wave--front">
      <svg viewBox="0 0 1440 190" preserveAspectRatio="none"><path class="hill2" d="M0 110 Q 180 74 360 110 T 720 110 T 1080 110 T 1440 110 V190 H0 Z"/></svg>
      <svg viewBox="0 0 1440 190" preserveAspectRatio="none"><path class="hill2" d="M0 110 Q 180 74 360 110 T 720 110 T 1080 110 T 1440 110 V190 H0 Z"/></svg>
    </div>
  </div>

  <!-- 主题切换幕布转场层 -->
  <div class="wipe" id="wipe" aria-hidden="true"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
